name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. 按锁文件安装依赖
        run: npm ci

      - name: 4. 同步网页代码到 Android 工程
        run: npx cap sync android

      - name: 5. 配置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 6. 赋予 Gradle 运行权限
        run: chmod +x ./android/gradlew

      - name: 7. 恢复永久签名密钥
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 仓库密钥"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/starlight-release.jks"

      - name: 8. 编译正式版与一次性数据迁移版
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/starlight-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGN_DEBUG_WITH_RELEASE: 'true'
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease

      - name: 9. 提供正式版 APK
        uses: actions/upload-artifact@v4
        with:
          name: Starlight-App-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 10. 提供一次性数据迁移 APK
        uses: actions/upload-artifact@v4
        with:
          name: Starlight-Data-Migration-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
